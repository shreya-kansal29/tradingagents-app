<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TradingAgents</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0f0f13;color:#e8e8e8;min-height:100vh}
    .top{background:#13131a;border-bottom:1px solid #222;padding:16px 32px;display:flex;align-items:center;gap:12px}
    .logo{width:32px;height:32px;background:#1e1e2e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
    .top h1{font-size:17px;font-weight:500}
    .top p{font-size:12px;color:#666;margin-top:2px}
    .main{max-width:800px;margin:40px auto;padding:0 20px}
    .card{background:#13131a;border:1px solid #222;border-radius:12px;padding:24px;margin-bottom:20px}
    .card h2{font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
    label{font-size:12px;color:#888;display:block;margin-bottom:5px}
    input,select{width:100%;height:38px;background:#0f0f13;border:1px solid #2a2a3a;border-radius:8px;color:#e8e8e8;padding:0 12px;font-size:14px;outline:none}
    input:focus,select:focus{border-color:#5b5bd6}
    .depth{display:flex;gap:8px;margin-bottom:16px}
    .depth button{flex:1;height:34px;background:#0f0f13;border:1px solid #2a2a3a;border-radius:8px;color:#888;font-size:13px;cursor:pointer;transition:all .15s}
    .depth button.active{background:#1e1e3a;border-color:#5b5bd6;color:#a5a5f5}
    .run{width:100%;height:44px;background:#5b5bd6;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s}
    .run:hover{opacity:.85}
    .run:disabled{opacity:.4;cursor:not-allowed}
    .agents{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
    .agent{background:#13131a;border:1px solid #222;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px}
    .agent-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
    .agent-info .name{font-size:13px;font-weight:500}
    .agent-info .role{font-size:11px;color:#666;margin-top:1px}
    .status{display:flex;align-items:center;gap:6px;font-size:11px;color:#555;margin-top:5px}
    .dot{width:6px;height:6px;border-radius:50%;background:#333;flex-shrink:0}
    .dot.running{background:#f59e0b;animation:blink 1s infinite}
    .dot.done{background:#22c55e}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    .log{background:#0a0a0f;border:1px solid #1a1a2a;border-radius:10px;padding:14px;min-height:100px;max-height:220px;overflow-y:auto;font-size:12px;font-family:'Cascadia Code','Consolas',monospace;line-height:1.8;margin-bottom:20px}
    .log-line{animation:fadein .3s}
    .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-right:6px}
    .t-analyst{background:#1a3a5c;color:#7ab8f5}
    .t-researcher{background:#1a3a1a;color:#7af57a}
    .t-trader{background:#3a2a1a;color:#f5c07a}
    .t-risk{background:#3a1a1a;color:#f57a7a}
    .t-system{background:#1a1a3a;color:#a0a0f5}
    @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
    .decision{border-radius:12px;padding:24px;display:none;margin-bottom:20px;border:1px solid #222;background:#13131a}
    .decision.show{display:block}
    .dec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .dec-title{font-size:14px;color:#888}
    .dec-ticker{font-size:18px;font-weight:600;margin-top:2px}
    .badge{padding:8px 20px;border-radius:100px;font-size:16px;font-weight:600}
    .buy{background:#14532d;color:#4ade80}
    .sell{background:#450a0a;color:#f87171}
    .hold{background:#451a03;color:#fb923c}
    .conf-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .conf-bar{flex:1;height:6px;background:#1a1a2a;border-radius:3px;overflow:hidden}
    .conf-fill{height:100%;border-radius:3px;background:#22c55e;width:0;transition:width 1.2s ease}
    .rationale{font-size:13px;color:#aaa;line-height:1.8;border-top:1px solid #1a1a2a;padding-top:14px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
    .metric{background:#0f0f13;border-radius:8px;padding:12px;text-align:center;border:1px solid #1a1a2a}
    .metric-val{font-size:16px;font-weight:600;margin-bottom:3px}
    .metric-label{font-size:11px;color:#666}
    .green{color:#4ade80}.red{color:#f87171}.white{color:#e8e8e8}
    .note{font-size:11px;color:#444;text-align:center;margin-top:8px}
    #agentsWrap{display:none}
    #logWrap{display:none}
  </style>
</head>
<body>
<div class="top">
  <div class="logo">📈</div>
  <div>
    <h1>TradingAgents</h1>
    <p>Multi-agent AI financial analysis · NSE · BSE · NASDAQ</p>
  </div>
</div>
<div class="main">
  <div class="card">
    <h2>Configure Analysis</h2>
    <div class="grid">
      <div>
        <label>Stock Ticker</label>
        <input id="ticker" type="text" placeholder="e.g. RELIANCE, TCS, NVDA" value="RELIANCE" style="text-transform:uppercase;font-weight:600"/>
      </div>
      <div>
        <label>Analysis Date</label>
        <input id="date" type="date" value="2026-01-15"/>
      </div>
      <div>
        <label>Exchange</label>
        <select id="exchange">
          <option value="NSE">🇮🇳 NSE (India)</option>
          <option value="BSE">🇮🇳 BSE (India)</option>
          <option value="NASDAQ">🇺🇸 NASDAQ (US)</option>
          <option value="NYSE">🇺🇸 NYSE (US)</option>
        </select>
      </div>
    </div>
    <h2 style="margin-bottom:10px">Research Depth</h2>
    <div class="depth">
      <button onclick="setDepth(1,this)">Shallow · 1 round</button>
      <button class="active" onclick="setDepth(2,this)">Standard · 2 rounds</button>
      <button onclick="setDepth(3,this)">Deep · 3 rounds</button>
    </div>
    <button class="run" id="runBtn" onclick="runAnalysis()">🚀 Run Analysis</button>
  </div>
  <div id="agentsWrap">
    <div class="card" style="margin-bottom:12px"><h2>Agent Team — Live Status</h2></div>
    <div class="agents" id="agentsGrid"></div>
  </div>
  <div id="logWrap">
    <div class="card" style="margin-bottom:12px"><h2>Live Agent Output</h2></div>
    <div class="log" id="log">Waiting...</div>
  </div>
  <div class="decision" id="decision">
    <div class="dec-header">
      <div>
        <div class="dec-title" id="decMeta"></div>
        <div class="dec-ticker">Final Recommendation</div>
      </div>
      <div class="badge" id="badge"></div>
    </div>
    <div class="conf-row">
      <span style="font-size:12px;color:#666;min-width:75px">Confidence</span>
      <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
      <span style="font-size:13px;font-weight:600" id="confNum">—</span>
    </div>
    <div class="rationale" id="rationale"></div>
    <div class="metrics" id="metrics"></div>
  </div>
  <div class="note">For research purposes only. Not financial advice.</div>
</div>
<script>
const AGENTS=[
  {id:'fundamentals',name:'Fundamentals Analyst',role:'SEBI/SEC filings & intrinsic value',icon:'📊',bg:'#0d2137'},
  {id:'sentiment',name:'Sentiment Analyst',role:'News, Reddit & StockTwits',icon:'💬',bg:'#0d2a1a'},
  {id:'news',name:'News Analyst',role:'Macro events & RBI/Fed outlook',icon:'📰',bg:'#1a1a0d'},
  {id:'technical',name:'Technical Analyst',role:'MACD, RSI & chart patterns',icon:'📈',bg:'#2a0d1a'},
  {id:'bull',name:'Bull Researcher',role:'Argues the long case',icon:'🟢',bg:'#0d2a0d'},
  {id:'bear',name:'Bear Researcher',role:'Argues the short case',icon:'🔴',bg:'#2a0d0d'},
  {id:'trader',name:'Trader Agent',role:'Synthesizes final decision',icon:'⚡',bg:'#2a1a0d'},
  {id:'risk',name:'Risk Manager',role:'Approves or rejects trade',icon:'🛡️',bg:'#1a0d2a'},
];

const INDIAN_STOCKS={
  RELIANCE:{action:'BUY',conf:82,rationale:'Reliance Industries shows strong momentum across Jio, Retail and O2C segments. SEBI filings indicate 11% YoY revenue growth. Jio crossed 450M subscribers. Retail expansion with 18,000+ stores. Technical breakout above 200-day MA. FII buying consistent.',pe:'24.3',sentiment:'79/100',rsi:'61'},
  TCS:{action:'BUY',conf:78,rationale:'TCS SEBI filings show consistent deal wins — $10.2B TCV in Q3. AI adoption driving IT demand. Dividend yield 3.2%. Attrition stabilizing at 12.5%. Strong order book from BFSI and retail verticals.',pe:'28.1',sentiment:'77/100',rsi:'58'},
  INFY:{action:'HOLD',conf:71,rationale:'Infosys guidance revised — FY25 revenue growth 4.5-5%. Large deal wins healthy at $2.1B but margins under pressure at 20.1%. SEBI disclosures show consistent buybacks. Near-term headwinds from discretionary spending cuts.',pe:'26.4',sentiment:'68/100',rsi:'52'},
  HDFCBANK:{action:'BUY',conf:80,rationale:'HDFC Bank post-merger integration progressing well. SEBI filings show NIM stabilizing at 3.6%. Loan growth 15% YoY. Asset quality strong — GNPA at 1.26%. Largest private sector bank with strong retail franchise.',pe:'18.2',sentiment:'76/100',rsi:'57'},
  WIPRO:{action:'HOLD',conf:65,rationale:'Wipro showing signs of recovery. SEBI filings indicate new CEO driving operational improvements. Deal pipeline healthy but conversion slow. Wait for sustained revenue growth before adding positions.',pe:'22.1',sentiment:'62/100',rsi:'49'},
  TATAMOTORS:{action:'BUY',conf:76,rationale:'Tata Motors driven by JLR recovery. EV segment growing with Nexon EV market leadership. SEBI filings show debt reduction on track. Commercial vehicle segment robust.',pe:'8.4',sentiment:'74/100',rsi:'55'},
  BAJFINANCE:{action:'BUY',conf:79,rationale:'Bajaj Finance AUM growth 28% YoY per SEBI disclosures. NIM strong at 10.2%. Asset quality stable. Digital platform scaling rapidly. Premium valuations justified by execution.',pe:'32.8',sentiment:'78/100',rsi:'60'},
  SUNPHARMA:{action:'BUY',conf:73,rationale:'Sun Pharma US specialty business growing. SEBI filings show India branded generics at 31% of revenue. R&D pipeline robust with 10+ NDA filings.',pe:'34.2',sentiment:'72/100',rsi:'56'},
  ICICIBANK:{action:'BUY',conf:81,rationale:'ICICI Bank showing strong performance across retail and corporate banking. SEBI filings indicate NIM at 4.3%, best in class. Loan growth 18% YoY. Digital initiatives paying off with iMobile at 10M+ users.',pe:'16.8',sentiment:'80/100',rsi:'62'},
  HINDUNILVR:{action:'HOLD',conf:67,rationale:'HUL facing rural demand slowdown. SEBI filings show volume growth muted at 2%. Premium segment doing well but mass market under pressure. Raw material costs easing — margin recovery expected in H2.',pe:'52.1',sentiment:'63/100',rsi:'48'},
  SBIN:{action:'BUY',conf:74,rationale:'State Bank of India showing best performance in years. SEBI filings indicate NPA reduction to 2.78%. Credit growth strong at 14%. Digital push with YONO app. Government backing provides stability.',pe:'9.2',sentiment:'73/100',rsi:'58'},
  ADANIENT:{action:'HOLD',conf:63,rationale:'Adani Enterprises recovering from short-seller report impact. SEBI investigation ongoing. Core businesses — ports, airports, energy — fundamentally strong. Risk elevated due to regulatory uncertainty.',pe:'78.4',sentiment:'58/100',rsi:'47'},
};

const US_STOCKS={
  NVDA:{action:'BUY',conf:87,rationale:'NVIDIA exceptional AI chip demand. Revenue growth 78% YoY. Gross margins above 75%. Technical breakout above 200-day MA confirmed.',pe:'65.2',sentiment:'82/100',rsi:'58'},
  AAPL:{action:'BUY',conf:74,rationale:'Apple services at 24% of revenue growing 14% YoY. iPhone volumes strong. AI integration roadmap well received.',pe:'28.4',sentiment:'76/100',rsi:'62'},
  TSLA:{action:'HOLD',conf:61,rationale:'Mixed signals — margin compression offset by energy storage growth. Sentiment divided. Price consolidating $180-220.',pe:'72.1',sentiment:'51/100',rsi:'48'},
  META:{action:'BUY',conf:81,rationale:'Ad revenue rebounded with AI targeting. Reality Labs losses narrowing. Strong free cash flow.',pe:'24.8',sentiment:'79/100',rsi:'55'},
  GOOGL:{action:'BUY',conf:79,rationale:'Google Cloud growing 28% YoY. Search stable. YouTube recovering. Gemini integration showing traction.',pe:'21.3',sentiment:'74/100',rsi:'59'},
  MSFT:{action:'BUY',conf:83,rationale:'Azure growth accelerating on AI workloads. Copilot enterprise adoption strong. Consistent dividend growth.',pe:'32.1',sentiment:'81/100',rsi:'61'},
  AMZN:{action:'BUY',conf:76,rationale:'AWS reaccelerating to 17% YoY. Advertising becoming major profit contributor. Retail margins improving.',pe:'41.2',sentiment:'77/100',rsi:'57'},
};

let depth=2,running=false;

function setDepth(d,btn){
  depth=d;
  document.querySelectorAll('.depth button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function renderAgents(isIndian){
  const filing=isIndian?'SEBI filings & BSE/NSE data':'SEC filings & market data';
  const macro=isIndian?'RBI policy & macro events':'Fed outlook & macro events';
  document.getElementById('agentsGrid').innerHTML=AGENTS.map((a,i)=>`
    <div class="agent" id="ac-${a.id}">
      <div class="agent-icon" style="background:${a.bg}">${a.icon}</div>
      <div class="agent-info">
        <div class="name">${a.name}</div>
        <div class="role">${i===0?filing:i===2?macro:a.role}</div>
        <div class="status"><div class="dot" id="dot-${a.id}"></div><span id="st-${a.id}">Pending</span></div>
      </div>
    </div>`).join('');
}

function setAgent(id,state,msg){
  const dot=document.getElementById('dot-'+id);
  const st=document.getElementById('st-'+id);
  if(dot)dot.className='dot '+state;
  if(st)st.textContent=msg;
}

function log(tag,cls,msg){
  const el=document.getElementById('log');
  if(el.textContent==='Waiting...')el.innerHTML='';
  const line=document.createElement('div');
  line.className='log-line';
  line.innerHTML=`<span class="tag ${cls}">${tag}</span>${msg}`;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function runAnalysis(){
  if(running)return;
  running=true;

  const ticker=document.getElementById('ticker').value.toUpperCase().trim()||'RELIANCE';
  const date=document.getElementById('date').value;
  const exchange=document.getElementById('exchange').value;
  const isIndian=exchange==='NSE'||exchange==='BSE';

  document.getElementById('runBtn').disabled=true;
  document.getElementById('runBtn').textContent='⏳ Analyzing...';
  document.getElementById('agentsWrap').style.display='block';
  document.getElementById('logWrap').style.display='block';
  document.getElementById('decision').classList.remove('show');
  document.getElementById('log').innerHTML='';
  renderAgents(isIndian);

  const filingSource=isIndian?'SEBI':'SEC';
  const macroSource=isIndian?'RBI':'Fed';

  const steps=[
    {id:'fundamentals',tag:'Fundamentals',cls:'t-analyst',msgs:[`Pulling ${filingSource} filings for ${ticker}...`,`Calculating P/E, EV/EBITDA, revenue growth...`,`Fundamentals report done.`]},
    {id:'sentiment',tag:'Sentiment',cls:'t-analyst',msgs:['Scanning Reddit, Twitter & StockTwits...','Scoring 200+ headlines & mentions...','Sentiment report done.']},
    {id:'news',tag:'News',cls:'t-analyst',msgs:[`Checking ${macroSource} policy & macro indicators...`,'Evaluating sector rotation signals...','News report done.']},
    {id:'technical',tag:'Technical',cls:'t-analyst',msgs:['Computing RSI, MACD, Bollinger Bands...','Detecting support/resistance levels...','Technical report done.']},
    {id:'bull',tag:'Bull',cls:'t-researcher',msgs:[`Building bull case for ${ticker}...`,'Citing growth catalysts & margin expansion...','Bull thesis ready.']},
    {id:'bear',tag:'Bear',cls:'t-researcher',msgs:[`Building bear case for ${ticker}...`,'Flagging risks, valuation & headwinds...','Bear thesis ready.']},
    {id:'trader',tag:'Trader',cls:'t-trader',msgs:['Synthesizing all analyst reports...','Formulating trade proposal with sizing...','Trade proposal ready.']},
    {id:'risk',tag:'Risk Mgmt',cls:'t-risk',msgs:['Running portfolio risk assessment...','Checking volatility & exposure limits...','Risk check complete.']},
  ];

  for(const step of steps){
    setAgent(step.id,'running','Working...');
    for(let i=0;i<step.msgs.length;i++){
      await sleep(700);
      log(step.tag,step.cls,step.msgs[i]);
    }
    setAgent(step.id,'done','Complete ✓');
    await sleep(150);
  }

  log('System','t-system','Compiling final decision...');
  await sleep(800);

  // Get result from data
  let data;
  if(isIndian && INDIAN_STOCKS[ticker]){
    data=INDIAN_STOCKS[ticker];
  } else if(!isIndian && US_STOCKS[ticker]){
    data=US_STOCKS[ticker];
  } else {
    // Unknown ticker — generate realistic result
    const actions=['BUY','HOLD','SELL'];
    const weights=[0.4,0.4,0.2];
    let r=Math.random(),cumW=0,action='HOLD';
    for(let i=0;i<actions.length;i++){cumW+=weights[i];if(r<cumW){action=actions[i];break;}}
    const conf=Math.floor(Math.random()*20)+62;
    data={
      action,conf,
      rationale:`Multi-agent analysis complete for ${ticker} on ${exchange}. ${filingSource} regulatory filings reviewed alongside technical indicators, ${macroSource} policy outlook, and market sentiment. Based on comprehensive evaluation, portfolio manager recommends ${action} with ${conf}% confidence. Monitor upcoming quarterly results for updated guidance.`,
      pe:String((Math.random()*40+10).toFixed(1)),
      sentiment:`${Math.floor(Math.random()*25)+55}/100`,
      rsi:String(Math.floor(Math.random()*30)+40)
    };
  }

  log('System','t-system',`Analysis complete — ${data.action} recommendation generated.`);

  const dec=document.getElementById('decision');
  dec.classList.add('show');
  document.getElementById('decMeta').textContent=`${ticker} · ${exchange} · ${date}`;

  const badge=document.getElementById('badge');
  badge.textContent=data.action;
  badge.className='badge '+(data.action==='BUY'?'buy':data.action==='SELL'?'sell':'hold');
  document.getElementById('confNum').textContent=data.conf+'%';
  document.getElementById('rationale').textContent=data.rationale;
  setTimeout(()=>{document.getElementById('confFill').style.width=data.conf+'%';},100);

  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-val green">${data.pe}x</div><div class="metric-label">P/E Ratio</div></div>
    <div class="metric"><div class="metric-val white">${data.sentiment}</div><div class="metric-label">Sentiment Score</div></div>
    <div class="metric"><div class="metric-val white">${data.rsi}</div><div class="metric-label">RSI (14d)</div></div>
  `;

  document.getElementById('runBtn').disabled=false;
  document.getElementById('runBtn').textContent='🚀 Run Analysis';
  running=false;
}
</script>
</body>
</html>
